<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Tapper</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#0f1115;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.bar{display:flex;gap:32px;font-size:18px;opacity:.85;text-align:center}
.bar b{display:block;font-size:34px;font-variant-numeric:tabular-nums}
#btn{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:0;background:#ff5a5f;color:#fff;font-size:28px;font-weight:700;box-shadow:0 10px 0 #b8383c;transition:transform .05s,box-shadow .05s}
#btn:active{transform:translateY(8px);box-shadow:0 2px 0 #b8383c}
#msg{height:24px;opacity:.7}
.new{color:#ffd84d;opacity:1!important;font-weight:700}
</style></head><body>
<div class="bar"><div>Taps<b id="n">0</b></div><div>Time<b id="t">10.0</b></div><div>Best<b id="b">0</b></div></div>
<button id="btn">TAP</button>
<div id="msg">Tap to start a 10 second round</div>
<script>
const $=i=>document.getElementById(i);let n=0,end=0,run=false,tick;
let best=+localStorage.getItem('tapper-best')||0;$('b').textContent=best;
function finish(){run=false;clearInterval(tick);$('t').textContent='0.0';
 if(n>best){best=n;localStorage.setItem('tapper-best',best);$('b').textContent=best;$('msg').textContent='New best: '+n+'!';$('msg').className='new'}
 else{$('msg').textContent='Time! '+n+' taps. Tap to retry';$('msg').className=''}
 $('btn').disabled=true;setTimeout(()=>{$('btn').disabled=false;n=0;run=false},700)}
$('btn').addEventListener('pointerdown',e=>{e.preventDefault();
 if(!run){n=0;run=true;end=performance.now()+10000;$('msg').className='';$('msg').textContent='Go!';
  tick=setInterval(()=>{const l=end-performance.now();if(l<=0)finish();else $('t').textContent=(l/1000).toFixed(1)},50)}
 n++;$('n').textContent=n;if(navigator.vibrate)navigator.vibrate(8)});
</script></body></html>
