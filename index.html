<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games by CosmeticAura</title>
<meta name="description" content="Small browser games that run on phones and laptops.">
<style>
:root{
  --bg:#f4f4f2;--card:#ffffff;--text:#1c1c1e;--muted:#6e6e73;--line:#e3e3e0;
  --accent:#E8461A;--radius:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--text:#f2f2f2;--muted:#9a9aa0;--line:#2c2c30;--accent:#FF6A2B;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--text:#f2f2f2;--muted:#9a9aa0;--line:#2c2c30;--accent:#FF6A2B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 20px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:32px}
h1{font-size:34px;line-height:1.1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
a.card:active{transform:scale(.98)}
.card h2{margin:0;font-size:20px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.play{font-weight:600;color:var(--accent);font-size:15px}
footer{margin-top:48px;color:var(--muted);font-size:13px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Games<span>.</span></h1>
      <p class="sub">Quick browser games. Your progress stays on your device.</p>
    </div>
    <div class="seg" role="group" aria-label="Appearance">
      <button data-t="system">System</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
    </div>
  </header>
  <main class="grid" id="list"></main>
  <footer>Made by <a href="https://github.com/CosmeticAura">CosmeticAura</a>. Source on <a href="https://github.com/CosmeticAura/games">GitHub</a>.</footer>
</div>
<script>
const root=document.documentElement,btns=[...document.querySelectorAll('.seg button')];
function setTheme(t){try{localStorage.setItem('games-theme',t)}catch(e){}
  if(t==='system')root.removeAttribute('data-theme');else root.dataset.theme=t;
  btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
let saved='system';try{saved=localStorage.getItem('games-theme')||'system'}catch(e){}
setTheme(saved);btns.forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
fetch('games.json').then(r=>r.json()).then(games=>{
  const list=document.getElementById('list');
  games.sort((a,b)=>b.added.localeCompare(a.added)).forEach(g=>{
    const a=document.createElement('a');a.className='card';a.href=g.slug+'/';
    a.innerHTML=`<h2></h2><p></p><div class="tags"></div><span class="play">Play</span>`;
    a.querySelector('h2').textContent=g.title;a.querySelector('p').textContent=g.blurb;
    const t=a.querySelector('.tags');(g.tags||[]).forEach(x=>{const s=document.createElement('span');s.className='tag';s.textContent=x;t.appendChild(s)});
    list.appendChild(a)});
});
</script>
</body>
</html>
